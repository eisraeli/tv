<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="google-site-verification" content="jDk1s6N-IOBTrNM4PV6WqMvZVyTrDHe8nv0tHPHHvaQ" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">TV</div>
      <button id="menuToggleButton" title="Channel List" style="display: none;">☰</button>
      <button id="backButton">← Back to Channels</button>
      <button id="multiViewButton" title="Multi-View Mode">▦ Multi-View</button>
      <div id="gridSizeControl" style="display: none; position: relative;">
        <button id="gridSizeButton" title="Grid Size">⊞ 2x2</button>
        <button id="exitMultiView" title="Exit Multi-View">✕</button>
      </div>
    </div>
    <div class="header-controls">
      <div class="search-container" id="searchContainer">
        <span class="search-icon" id="searchToggle">🔍</span>
        <input type="text" class="search-input" id="globalSearch" placeholder="Search channels...">
        <button class="search-close" id="searchClose">✕</button>
      </div>
      <button id="qualityButton" title="Stream Quality" style="display: none;">HD</button>
      <button id="fullscreenButton" title="Fullscreen" style="display: none;">⛶</button>
      <button id="pipButton" title="Picture-in-Picture" style="display: none;">⧉</button>
      <button id="numpadButton" title="Channel Number" style="display: none;">123</button>
      <button id="muteButton" title="Toggle Mute">🔊</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
      <div class="menu-search">
        <input type="text" class="menu-search-input" id="menuSearch" placeholder="Search channels...">
      </div>
      <div class="favorites-section" id="favoritesSection" style="display: none;">
        <div class="favorites-header">Favorites</div>
        <div id="favoriteChannels"></div>
      </div>
      <div class="all-channels-header">
        <h3>All Channels</h3>
      </div>
      <div id="menuChannels">
        <!-- Menu items will be populated here -->
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
      <!-- Channel Picker -->
      <div id="channelPicker">
        <div class="loading">Loading channels...</div>
      </div>
      <div id="noResults" class="no-results" style="display: none;">
        No channels found
      </div>
    </div>
  </div>
  <!-- Video Container -->
  <div id="videoContainer"></div>
  
  <!-- Multi-View Container -->
  <div id="multiViewContainer" class="multi-view-container" style="display: none;">
    <div id="multiViewGrid" class="multi-view-grid grid-2x2">
      <!-- Video slots will be dynamically created -->
    </div>
  </div>
  <div id="channel-input-display" class="hidden">
    <span>_</span>
    <span>_</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
