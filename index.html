<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google-site-verification" content="jDk1s6N-IOBTrNM4PV6WqMvZVyTrDHe8nv0tHPHHvaQ" />
  <link rel="icon" href="https://i.imgur.com/opmOlZ5.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">TV</div>
      <button id="backButton">← Back to Channels</button>
      <button id="multiViewButton" title="Multi-View Mode">▦ Multi-View</button>
    </div>
    <div class="header-controls">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="globalSearch" placeholder="Search channels...">
      </div>
      <button id="muteButton" title="Toggle Mute">🔊</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
      <div class="menu-search">
        <input type="text" class="menu-search-input" id="menuSearch" placeholder="Search channels...">
      </div>
      <div class="favorites-section" id="favoritesSection" style="display: none;">
        <div class="favorites-header">Favorites</div>
        <div id="favoriteChannels"></div>
      </div>
      <div class="all-channels-header">
        <h3>All Channels</h3>
      </div>
      <div id="menuChannels">
        <!-- Menu items will be populated here -->
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
      <!-- Channel Picker -->
      <div id="channelPicker">
        <div class="loading">Loading channels...</div>
      </div>
      <div id="noResults" class="no-results" style="display: none;">
        No channels found
      </div>
    </div>
  </div>
  <!-- Video Container -->
  <div id="videoContainer"></div>
  
  <!-- Multi-View Container -->
  <div id="multiViewContainer" class="multi-view-container" style="display: none;">
    <div class="multi-view-controls">
      <button class="grid-btn" data-grid="1x1">1x1</button>
      <button class="grid-btn active" data-grid="2x2">2x2</button>
      <button class="grid-btn" data-grid="3x3">3x3</button>
      <button class="grid-btn" data-grid="2x3">2x3</button>
      <button id="exitMultiView">✕ Exit Multi-View</button>
    </div>
    <div id="multiViewGrid" class="multi-view-grid grid-2x2">
      <!-- Video slots will be dynamically created -->
    </div>
  </div>
  <div id="channel-input-display" class="hidden">
    <span>_</span>
    <span>_</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
  <script src="script.js"></script>
</body>
</html>
